<title>SIRIUS 40 m² — 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
:root{--noir:#05070E;--nuit:#0D2055;--electric:#065BF5;--cyan:#1F9FFA;--chrome:#E7E9F1;--argent:#A4B1D1;--panel:rgba(13,18,36,.72);--bord:rgba(164,177,209,.22);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 15%,#1A2550 0%,#0A0F22 55%,var(--noir) 100%);color:var(--chrome);font-family:"Inter",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
model-viewer{position:fixed;inset:0;width:100%;height:100%;--poster-color:transparent;--progress-bar-color:var(--cyan)}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:max(16px,env(safe-area-inset-top)) 20px 16px;pointer-events:none}
header img{height:34px;filter:drop-shadow(0 4px 14px rgba(6,91,245,.5))}
.t{display:flex;flex-direction:column}
.eye{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan)}
h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:22px;line-height:1.1;color:#fff}
.dims{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--argent);text-align:right;line-height:1.5}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));width:min(560px,calc(100% - 32px));
  background:var(--panel);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--bord);border-radius:20px;padding:12px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lab{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:13px;color:#fff}
.lab span{color:var(--argent);font-weight:500}
.sws{display:flex;gap:10px;margin-top:10px;overflow-x:auto;padding:2px}
.sw{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;color:var(--argent);font:500 10px "JetBrains Mono",monospace;cursor:pointer;min-width:52px}
.sw i{width:36px;height:36px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);transition:transform .2s}
.sw[aria-pressed="true"]{color:#fff}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--noir),0 0 0 4px var(--cyan);transform:scale(1.06)}
.sw:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
.btns{display:flex;gap:8px}
.b{border:1px solid var(--bord);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:8px 13px;font:600 12px "Space Grotesk",sans-serif;cursor:pointer;min-height:36px}
.b[aria-pressed="true"],.b.ar{background:linear-gradient(135deg,var(--electric),#0031DF);border-color:transparent}
.hint{position:fixed;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 150px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;color:var(--argent);pointer-events:none;transition:opacity .6s}
.foot{margin-top:9px;font-size:10px;color:var(--argent);text-align:center}
.foot b{font-family:"Space Grotesk";color:#fff}
@media (max-width:520px){h1{font-size:18px}.dims{display:none}.b{padding:7px 11px}}
</style>
</head>

  auto-rotate auto-rotate-delay="1500" rotation-per-second="14deg" camera-orbit="-32deg 76deg auto" min-camera-orbit="auto 20deg auto" max-camera-orbit="auto 88deg auto"
  shadow-intensity="1.1" shadow-softness="0.8" exposure="1.05" tone-mapping="aces" environment-image="neutral" interaction-prompt="none"
  ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor">
  <button slot="ar-button" class="b ar" style="position:fixed;top:max(70px,calc(env(safe-area-inset-top) + 58px));right:20px">Voir chez moi (AR)</button>
</model-viewer>

<script>
const TEINTES = [
  ["6019", "#A1C3A9", "Vert pastel"],
  ["1014", "#F6EACE", "Ivoire"],
  ["1001", "#DCB68C", "Beige"],
  ["7032", "#D0C8BE", "Gris silex"],
  ["5024", "#92B0AE", "Bleu pastel"],
];
const CIBLES = ["Bardage", "Cadre lisse", "Menuiseries"];
const mv = document.getElementById("mv");
const box = document.getElementById("sws");
const nom = document.getElementById("nom");
let courant = TEINTES[0][1];

function teinter(hex) {
  courant = hex;
  if (!mv.model) return;
  for (const m of mv.model.materials)
    if (CIBLES.includes(m.name)) m.pbrMetallicRoughness.setBaseColorFactor(hex);
}

TEINTES.forEach(([ral, hex, label], i) => {
  const b = document.createElement("button");
  b.className = "sw";
  b.setAttribute("aria-pressed", i === 0);
  b.innerHTML = `<i style="background:${hex}"></i>${ral}`;
  b.onclick = () => {
    box.querySelectorAll(".sw").forEach(x => x.setAttribute("aria-pressed", x === b));
    nom.textContent = `RAL ${ral} · ${label}`;
    teinter(hex);
  };
  box.appendChild(b);
});

mv.addEventListener("load", () => teinter(courant));
mv.addEventListener("camera-change", e => {
  if (e.detail.source === "user-interaction") document.getElementById("hint").style.opacity = 0;
});
const rot = document.getElementById("rot");
rot.onclick = () => {
  const on = !mv.autoRotate;
  mv.autoRotate = on;
  rot.setAttribute("aria-pressed", on);
};
